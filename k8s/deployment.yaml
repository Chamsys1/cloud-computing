apiVersion: apps/v1
kind: Deployment
metadata:
  name: storingsmelder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storingsmelder
  template:
    metadata:
      labels:
        app: storingsmelder
    spec:
      containers:
        - name: web
          image: ghcr.io/chamsys1/storingsmelder:1.1
          ports:
            - containerPort: 8000
